# Staging patch for app-b/qwen3-8b-int4-vllm.
# Apply only after validating the parser choice against the exact vLLM image tag in use.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-8b-int4-vllm
  namespace: app-b
spec:
  template:
    spec:
      containers:
        - name: vllm
          args:
            - --host
            - 0.0.0.0
            - --port
            - $(VLLM_PORT)
            - --model
            - $(MODEL_ID)
            - --tokenizer
            - $(TOKENIZER_ID)
            - --served-model-name
            - $(SERVED_MODEL_NAME)
            - --dtype
            - auto
            - --api-key
            - $(API_KEY)
            - --gpu-memory-utilization
            - $(GPU_MEMORY_UTILIZATION)
            - --max-model-len
            - $(MAX_MODEL_LEN)
            - --max-num-seqs
            - $(MAX_NUM_SEQS)
            - --max-num-batched-tokens
            - $(MAX_NUM_BATCHED_TOKENS)
            - --tensor-parallel-size
            - "1"
            - --enable-prefix-caching
            - --enable-chunked-prefill
            - --reasoning-parser
            - qwen3
            - --enable-auto-tool-choice
            - --tool-call-parser
            - $(TOOL_CALL_PARSER)
            - --quantization
            - compressed-tensors
            - --download-dir
            - /var/lib/huggingface
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen3-8b-int4-config
  namespace: app-b
data:
  TOOL_CALL_PARSER: hermes

<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>callLLM Workflow</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=excon@300,400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20260416l" />
  </head>
  <body data-page="workflow">
    <main class="page-shell">
      <header class="hub-header brutal-header">
        <div class="brand-row">
          <a class="brand-mark" href="./index.html" aria-label="callLLM Home">
            <svg class="brand-badge" viewBox="0 0 32 32" aria-hidden="true">
              <rect class="brand-badge-frame" x="1" y="1" width="30" height="30" rx="7" />
              <path class="brand-badge-glyph" d="M8 24.5L14.4 7.5H17.6L24 24.5H19.9L16 14.2L12.1 24.5H8Z" />
              <rect class="brand-badge-glyph" x="13.2" y="18.1" width="5.6" height="2.2" rx="1.1" />
            </svg>
            <span class="brand-copy">
              <strong>callLLM Workflow</strong>
              <span>canvas builder</span>
            </span>
          </a>

          <nav class="hub-nav brutal-nav" aria-label="메인 섹션">
            <a href="./index.html">Browse</a>
            <a class="is-current" href="./workflow.html">Workflow</a>
            <a href="./response.html">Response</a>
            <a href="./results.html">Results</a>
          </nav>
        </div>

        <div class="header-controls">
          <div class="hub-search brutal-search" aria-hidden="true">
            <svg class="search-icon" viewBox="0 0 18 18" aria-hidden="true">
              <rect class="search-icon-frame" x="1" y="1" width="16" height="16" rx="4" />
              <path class="search-icon-glyph" d="M4.7 13.5L8.3 4.5H9.7L13.3 13.5H10.9L9 8.4L7.1 13.5H4.7Z" />
            </svg>
            <span>Canvas builder</span>
          </div>
          <div class="theme-switcher" aria-label="테마 선택">
            <button class="theme-chip" type="button" data-action="select-theme" data-theme="red">Red</button>
            <button class="theme-chip" type="button" data-action="select-theme" data-theme="blue">Blue</button>
            <button class="theme-chip" type="button" data-action="select-theme" data-theme="yellow">Yellow</button>
          </div>
          <button class="ghost-button" id="refresh-button" type="button">Refresh</button>
          <button class="primary-button" id="run-button" type="button">Run Benchmark</button>
        </div>
      </header>

      <section class="surface-panel brutal-panel workflow-context-panel">
        <div class="control-header">
          <span class="section-kicker">Active benchmark</span>
        </div>
        <div class="selected-models inline-tiles" id="selected-models"></div>
        <div class="selection-meta inline-stats" id="selection-meta"></div>
        <div class="workflow-case-brief" id="workflow-case-brief"></div>
      </section>

      <section class="workflow-stage">
        <aside class="surface-panel brutal-panel node-palette-panel">
          <div class="control-header">
            <span class="section-kicker">Palette</span>
          </div>
          <div class="palette-list" id="palette-list"></div>
        </aside>

        <section class="surface-panel brutal-panel workflow-panel workflow-panel-full">
          <div class="section-heading compact">
            <div>
              <p class="section-kicker">Canvas</p>
              <h2>Workflow</h2>
            </div>
            <div class="panel-actions">
              <button class="ghost-button" id="auto-layout-button" type="button">Auto layout</button>
              <button class="ghost-button" id="reset-workflow-button" type="button">Reset flow</button>
            </div>
          </div>

          <div class="canvas-shell">
            <div class="canvas-toolbar">
              <span class="canvas-status" id="status-text">drag nodes, run, auto-open results</span>
            </div>
            <div class="canvas-surface canvas-surface-expanded" id="canvas-surface">
              <svg class="canvas-links" id="canvas-links" aria-hidden="true"></svg>
              <div class="canvas-insertions" id="canvas-insertions"></div>
              <div class="canvas-nodes" id="canvas-nodes"></div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="./app.js?v=20260416l"></script>
  </body>
</html>

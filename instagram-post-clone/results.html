<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>callLLM Results</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=excon@300,400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="results">
    <main class="page-shell">
      <header class="hub-header brutal-header">
        <div class="brand-row">
          <a class="brand-mark" href="./results.html" aria-label="callLLM Results">
            <span class="brand-badge">cL</span>
            <span class="brand-copy">
              <strong>callLLM Results</strong>
              <span>benchmark review</span>
            </span>
          </a>

          <nav class="hub-nav brutal-nav" aria-label="메인 섹션">
            <a href="./index.html">Browse</a>
            <a href="./workflow.html">Workflow</a>
            <a href="./response.html">Response</a>
            <a class="is-current" href="./results.html">Results</a>
          </nav>
        </div>

        <div class="header-controls">
          <div class="hub-search brutal-search" aria-hidden="true">
            <span class="search-icon">/</span>
            <span>Results review</span>
          </div>
          <div class="theme-switcher" aria-label="테마 선택">
            <button class="theme-chip" type="button" data-action="select-theme" data-theme="red">Red</button>
            <button class="theme-chip" type="button" data-action="select-theme" data-theme="blue">Blue</button>
            <button class="theme-chip" type="button" data-action="select-theme" data-theme="yellow">Yellow</button>
          </div>
          <button class="ghost-button" id="refresh-button" type="button">Refresh</button>
          <a class="primary-button inline-link-button" href="./index.html">Browse</a>
        </div>
      </header>

      <section class="results-page-grid">
        <section class="surface-panel brutal-panel results-panel">
          <div class="section-heading compact">
            <div>
              <p class="section-kicker">Summary</p>
              <h2>Latest benchmark</h2>
            </div>
          </div>
          <div class="run-summary" id="run-summary"></div>
        </section>

        <section class="surface-panel brutal-panel results-panel">
          <div class="section-heading compact">
            <div>
              <p class="section-kicker">Detail</p>
              <h2>Trace and request</h2>
            </div>
          </div>
          <div class="history-detail" id="history-detail"></div>
        </section>
      </section>

      <section class="surface-panel brutal-panel results-panel">
        <div class="section-heading compact">
          <div>
            <p class="section-kicker">Feed</p>
            <h2>Result history</h2>
          </div>
        </div>
        <div class="results-feed" id="results-feed"></div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
